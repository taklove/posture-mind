server {
    listen 80;
    server_name manus.xin www.manus.xin;

    # 让 certbot webroot 验证能成功
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 全部 HTTP 请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name manus.xin www.manus.xin;

    root /var/www/posturemind;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/manus.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manus.xin/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~* \.(html|css|js|json|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/posturemind_access.log;
    error_log /var/log/nginx/posturemind_error.log;
}
