server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/posturemind;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location ~* \.(html|css|js|json|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/posturemind_access.log;
    error_log /var/log/nginx/posturemind_error.log;
}
