name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build ${{ github.event.inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.10.2
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$(pwd)/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Set up MediaPipe model
        run: |
          mkdir -p android/app/src/main/assets
          curl -L -o android/app/src/main/assets/pose_landmarker_lite.task \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
          ls -la android/app/src/main/assets/

      - name: Decode signing keystore (release only)
        if: github.event.inputs.build_type == 'release' || (github.event.name == 'push' && github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/app/signing
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/signing/posturemind-release.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=signing/posturemind-release.jks" >> android/key.properties
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
            echo "Keystore decoded successfully"
          else
            echo "No keystore configured, will build debug-signed APK"
          fi

      - name: Build with Gradle
        run: |
          cd android
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ] && [ -f "key.properties" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find generated APKs
        id: find_apks
        run: |
          echo "apk_paths=$(find android/app/build/outputs/apk -name '*.apk' -type f | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: posturemind-apk
          path: ${{ steps.find_apks.outputs.apk_paths }}
          if-no-files-found: error
          retention-days: 30

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## PostureMind Android v${{ github.ref_name }}

            Auto-generated build from GitHub Actions.
          files: ${{ steps.find_apks.outputs.apk_paths }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## Build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK files generated:" >> $GITHUB_STEP_SUMMARY
          for apk in $(find android/app/build/outputs/apk -name '*.apk' -type f); do
            size=$(du -h "$apk" | cut -f1)
            echo "- \`$apk\` ($size)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
